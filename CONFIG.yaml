# ==============================================================================
# Kaggle Autonomous Multi-Agent System (KAMAS) - Production Configuration
# Operating Environment: Antigravity CLI + Gemini 3.8 Flash High
# ==============================================================================

system:
  name: "kaggle-autonomous-multi-agent-system"
  version: "1.0.0"
  model: "gemini-3.8-flash-high"
  effort: "high"
  seed: 42
  deterministic: true
  timezone: "UTC"

paths:
  workspace_root: "."
  blackboard_dir: "experiments/blackboard"
  experiments_db: "memory/experiments.db"
  knowledge_dir: "knowledge"
  rules_dir: ".agents/rules"
  agents_dir: ".agents/agents"
  skills_dir: ".agents/skills"
  templates_dir: "templates"
  artifacts_dir: "experiments/artifacts"
  worktrees_dir: "experiments/worktrees"
  submissions_dir: "experiments/submissions"
  logs_dir: "observability/logs"

hardware:
  primary_accelerator: "NvidiaTeslaT4" # Dual T4 default for GPU competitions
  secondary_accelerator: "NvidiaL4"   # Fallback for high VRAM requirements
  disallowed_accelerator: "NvidiaTeslaP100" # Pascal sm_60 lacks PyTorch cu128 kernels
  cpu_ram_gb: 30
  disk_gb: 73
  kaggle_weekly_gpu_limit_hours: 30
  session_timeout_hours: 12
  internet_allowed_at_training: true
  internet_allowed_at_inference: false # Strict code competition constraint

budget:
  max_weekly_gpu_hours: 28.0 # 2-hour safety margin
  max_session_hours: 10.5    # 1.5-hour safety margin before hard 12h kill
  max_experiments_per_phase: 25
  max_concurrent_runners: 2
  daily_submission_limit: 5
  submission_safety_margin: 1 # Reserve at least 1 submission for emergency rollback
  ev_threshold_for_execution: 0.15 # Minimum expected value score to schedule trial

validation:
  primary_metric_direction: "maximize" # maximize or minimize
  cv_folds: 5
  adversarial_auc_threshold: 0.70 # Warn if train/test drift > 0.70; veto if > 0.85
  leakage_target_corr_veto: 0.999 # Automatic veto if non-target feature correlation ~ 1.0
  min_cv_lb_correlation: 0.80 # Rank correlation threshold between CV and Public LB
  hard_veto_on_leakage: true
  require_oofs_for_blending: true

protocols:
  truth_engine: "deterministic_code_execution"
  agent_veto_roles:
    - "validation_architect"
    - "leakage_compliance"
  state_persistence: "filesystem_blackboard" # JSON/YAML files + SQLite
  git_isolation: "git_worktrees"
  model_family_allowlist:
    - "lightgbm"
    - "xgboost"
    - "catboost"
    - "pytorch_tabular"
    - "scikit-learn"

rules_enforcement:
  single_account_only: true
  no_external_data_without_forum_post: true
  no_private_sharing: true
  internet_disabled_submission_check: true
  single_reasoning_model: "gemini-3.8-flash-high"
  disallow_model_delegation_skills: true
