- hypothesis_id: hypo_domain_features_001
  title: "Domain Interaction & Behavioral Gating Feature Block"
  description: "Physics-inspired and behavioral gating features: Total Charging Accessibility, Commute-to-Charging Ratio, Income per Vehicle, Subsidy-Environmental Gating, Commute-Range Anxiety Penalty, and City/Car Groupby Income Residuals."
  category: feature_engineering
  model_family: lightgbm
  parameters:
    n_estimators: 1200
    learning_rate: 0.04
    num_leaves: 31
    max_depth: 6
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_samples: 50
  feature_transforms:
    - "Total_Charging = Charging_Stations_Near_Home + Charging_Stations_Near_Work"
    - "Commute_Charging_Ratio = Daily_Commute_km / (Total_Charging + 1.0)"
    - "Income_Per_Car = Annual_Income_USD / (Number_of_Cars_Owned + 1.0)"
    - "Subsidy_x_Environmental = (Subsidy_Available == 'Yes').astype(float) * Environmental_Concern_Level"
    - "Commute_x_RangeAnxiety = Daily_Commute_km * Range_Anxiety_Level_Mapped"
    - "Groupby_City_Car_Income_Diff = Annual_Income_USD - mean(Annual_Income_USD by [City_Type, Current_Car_Type])"
  ev:
    expected_gain: 0.0030
    confidence: 0.85
    info_gain: 0.80
    compute_cost: 0.08
    risk: 0.05
  ev_score: 0.024286

- hypothesis_id: hypo_catboost_symmetric_003
  title: "Symmetric Oblivious Tree CatBoost with Native Combinations"
  description: "Orthogonal tree architecture utilizing depth-wise symmetric (oblivious) trees and native on-the-fly categorical combinations. Delivers uncorrelated error profile relative to leaf-wise LightGBM."
  category: model_exploration
  model_family: catboost
  parameters:
    iterations: 1500
    learning_rate: 0.04
    depth: 6
    l2_leaf_reg: 5.0
    early_stopping_rounds: 50
    cat_features:
      - Gender
      - City_Type
      - Current_Car_Type
      - Home_Charging_Possible
      - Subsidy_Available
      - Range_Anxiety_Level
  feature_transforms:
    - "Pass raw string categoricals directly into CatBoost native categorical handling engine"
  ev:
    expected_gain: 0.0035
    confidence: 0.90
    info_gain: 0.90
    compute_cost: 0.18
    risk: 0.05
  ev_score: 0.015000

- hypothesis_id: hypo_target_encoding_002
  title: "Fold-Isolated M-Estimate Target Encoding on Higher-Order Categorical Tuples"
  description: "Out-of-fold target encoding with additive m-estimate smoothing (m=25.0) on multi-way compound categoricals (City_Type x Current_Car_Type, Car_Type x Home_Charging, Car_Type x Subsidy) strictly isolated inside the CV loop."
  category: feature_engineering
  model_family: lightgbm
  parameters:
    m_smoothing: 25.0
    n_estimators: 1000
    learning_rate: 0.04
    num_leaves: 31
    max_depth: 6
  feature_transforms:
    - "TE_Tuple_City_Car = OOF_TargetEncode(City_Type + '_' + Current_Car_Type, m=25.0)"
    - "TE_Tuple_City_Car_HomeCharge = OOF_TargetEncode(City_Type + '_' + Current_Car_Type + '_' + Home_Charging_Possible, m=25.0)"
    - "TE_Tuple_Car_Subsidy = OOF_TargetEncode(Current_Car_Type + '_' + Subsidy_Available, m=25.0)"
  ev:
    expected_gain: 0.0018
    confidence: 0.75
    info_gain: 0.65
    compute_cost: 0.07
    risk: 0.10
  ev_score: 0.011396
