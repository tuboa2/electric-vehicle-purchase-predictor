- hypothesis_id: hypo_interaction_001
  title: Non-linear multiplicative interaction of feat_1 and feat_2
  description: Physics-based interaction product feature
  category: feature_engineering
  model_family: lightgbm
  parameters:
    n_estimators: 150
    learning_rate: 0.03
    num_leaves: 20
  feature_transforms:
  - feat_interact = feat_1 * feat_2
  ev:
    expected_gain: 0.005
    confidence: 0.8
    info_gain: 0.7
    compute_cost: 0.05
    risk: 0.05
  ev_score: 0.05333333333333333
