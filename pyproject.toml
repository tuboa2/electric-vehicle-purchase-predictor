[project]
name = "kaggle-agents"
version = "1.0.0"
description = "Self-Evolving Autonomous Kaggle Multi-Agent System on Antigravity CLI + Gemini 3.8 Flash High"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle>=1.6.0",
    "lightgbm>=4.3.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "pydantic>=2.7.0",
    "pytest>=8.0.0",
    "pyyaml>=6.0.1",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
]

[project.scripts]
kaggle-os = "scripts.run_pipeline:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "evaluation*",
    "orchestration*",
    "schemas*",
    "kaggle*",
    "memory*",
    "experiments*",
    "templates*",
    "scripts*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
pythonpath = ["."]
